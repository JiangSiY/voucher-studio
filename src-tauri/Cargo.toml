[package]
name = "voucher-studio"
description = "Voucher Studio 桌面应用（Tauri 壳）"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
voucher-core = { path = "../crates/voucher-core" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["time"] }
# macos-private-api：透明窗口 + 原生材质（windowEffects）在 macOS 上的前置条件
# （规范 §1.4；Spike M 已验证 透明 + sidebar 材质被系统接受）。代价：不可上架 App Store
# —— 本项目本就 ad-hoc 签名、不上架，见 README「已知限制」。
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"

[features]
default = []
# 生产模式：内嵌打包好的前端（dist/），双击即可离线运行，不依赖开发服务器
custom-protocol = ["tauri/custom-protocol"]
