[package]
name = "voucher-studio"
description = "Voucher Studio 桌面应用（Tauri 壳）"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
voucher-api = { path = "../crates/voucher-api" }
voucher-core = { path = "../crates/voucher-core" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["time"] }
# v0.27 工作台重构起改用系统原生标题栏，不再需要 macos-private-api
# （该特性为透明窗口 + windowEffects 的前置条件；去掉后仍 ad-hoc 签名、不上架）。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
# 自动更新（挂账 #39）：检查 GitHub Release 的 latest.json → 下载 .app.tar.gz → 验签 → 重启
# 更新包由 scripts/release.sh 在 package-macos.sh 之后重打并签名，bundler 不生成（见 README「自动更新」）
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 26+ 的 Liquid Glass（NSGlassEffectView）与旧版 vibrancy（NSVisualEffectView）。
# 只在 macOS 目标下编译——Linux（CI 快门禁）不构建本依赖，cfg 门控的调用点也为空实现。
window-vibrancy = "0.8"

[features]
default = []
# 生产模式：内嵌打包好的前端（dist/），双击即可离线运行，不依赖开发服务器
custom-protocol = ["tauri/custom-protocol"]
