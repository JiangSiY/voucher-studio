name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (vue-tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # opencv-rust 0.100 通过 pkg-config 探测系统 OpenCV 4.x；
      # clang/libclang 供 bindgen 生成绑定；libssl-dev 供 reqwest 默认 TLS；
      # fonts-noto-cjk 供 PDF 导出测试的中文字体需求
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopencv-dev \
            clang \
            libclang-dev \
            libssl-dev \
            pkg-config \
            fonts-noto-cjk \
            fonts-droid-fallback

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p voucher-core --all-targets -- -D warnings

      # B2 #11：命令层越层门禁——GUI 壳不得直连仓储类型或裸连接，
      # 查询经 services::query 门面、写路径经领域服务（UoW with_tx）
      - name: Layering guard (no db::repos / raw connection in commands)
        run: |
          if grep -rnE 'db::repos|\.with_(conn|tx)\(' src-tauri/src; then
            echo "错误：命令层不得直连 db::repos 仓储类型或裸 with_conn/with_tx（应经 services::query / 领域服务中转）"
            exit 1
          fi

      - name: Test
        run: cargo test -p voucher-core
