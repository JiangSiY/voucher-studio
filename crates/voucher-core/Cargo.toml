[package]
name = "voucher-core"
description = "Voucher Studio 业务核心（不依赖 Tauri，可独立测试）"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
chrono.workspace = true
log.workspace = true
md5 = "0.7"
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native"] }
directories = "5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
# v0.23：printpdf 0.7 → 0.12.8（修 RUSTSEC-2026-0187：0.7 经 lopdf 0.31 传入；
# 0.12.8 用 lopdf ^0.44）。default features 会拉 azul 的 HTML 渲染栈，故关掉只留需要的能力：
#   - png / jpeg：附件图片解码（`RawImage::decode_from_bytes`）
#   - **text_layout：必须开**——0.12 的字体子集化（`PdfSaveOptions::subset_fonts`）
#     只在 `text_layout` feature 下真实生效；不开就整份字体入库（Hiragino ≈9.4MB/份）。
#     它带来 azul-layout / rust-fontconfig 依赖，但纯 Rust、无系统库，编译约 +45s。
printpdf = { version = "0.12.8", default-features = false, features = ["png", "jpeg", "text_layout"] }
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
# v0.6 文档扫描矫正与增强（5.5 方案）：opencv-rust 绑定 OpenCV 4.x
# +30MB 装包、首次编译 3-8 分钟。链接到系统 OpenCV 4.x（环境变量 OpenCV_DIR + OPENCV_LINK_*）。
# 必须保留 default features（含 core/types），否则会报 GpuMat/UMat trait bound 错误。
opencv = { version = "0.100", features = ["imgproc", "imgcodecs", "calib3d"] }
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
# v0.14-A：备份加密改 age passphrase 信封（格式 v4）——zip 内仍是明文结构，
# 写盘前用 age 的流式 AEAD（ChaCha20-Poly1305）密封整个文件；不再做条目级 zip 加密。
# 旧 v0.13 条目级 AES（zip aes-crypto feature）仅保留读兼容。
age = "0.11"
base64 = "0.22"
# v0.13：账单 CSV 对账（支付宝导出常为 GBK 编码）
encoding_rs = "0.8"
# v0.10：Excel 导出（纯 Rust、无 C 依赖）
rust_xlsxwriter = "0.79"
# 本地 OCR：v0.23 起改用 Apple Vision（services/ocr_vision.rs，手写 objc FFI、零新增依赖），
# 原先的 ort（ONNX Runtime）依赖与 assets/ocr-models 模型资产已在本批删除；
# 历史实现见 git 历史里的 services/ocr_local.rs（2026-10-26，第六十七笔）。

[dev-dependencies]
tempfile = "3"

# 文件锁的 POSIX 实现用 flock（CI/Linux 及未来 macOS）
[target.'cfg(unix)'.dependencies]
libc = "0.2"
