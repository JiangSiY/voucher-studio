[package]
name = "voucher-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "voucher-studio 的命令行入口：台账清单导入、待归档查询（供脚本/自动化调用）"

[[bin]]
name = "voucher-cli"
path = "src/main.rs"

[dependencies]
voucher-core = { path = "../voucher-core" }
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
# 仅测试：CLI 本机 HTTPS 验收用的 rustls 测试服务（与 voucher-core 测试同一套夹具）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
