[workspace]
resolver = "2"
# spikes/* 为一次性验证程序（G1 Spike B 已完成并固化为 voucher-core::services::ocr），不参与日常构建
members = ["crates/voucher-core", "src-tauri"]

[workspace.package]
version = "0.14.0"
edition = "2021"
authors = ["Voucher Studio"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
